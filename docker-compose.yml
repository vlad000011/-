services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swapspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swapspace_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-swapspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swapspace} -d ${POSTGRES_DB:-swapspace}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swapspace}:${POSTGRES_PASSWORD:-swapspace_dev_password}@db:5432/${POSTGRES_DB:-swapspace}?schema=public
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
